name: Promote content to main (TEST)

# Fires when the watcher pushes a `[ship]` commit to cms-content. Verifies the
# change is blog-only, validates content, then promotes cms-content → main.
# TEST repo: there is no deploy step and no AWS — promotion just means "merged
# to main". In production this is where staging→main + the live deploy hang.

on:
  push:
    branches: [cms-content]

permissions:
  contents: write

jobs:
  promote:
    # only ship commits explicitly marked by the watcher
    if: contains(github.event.head_commit.message, '[ship]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — only blog content may auto-promote
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files since main:"; echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE '^(src/content/blog/en/|public/images/blog/)' | grep -v '^$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-blog files changed — refusing to auto-promote:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: change is blog-only"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate content gate
        run: |
          npm ci
          node scripts/validate-content.mjs
          # (production also runs the full `npm run build` here as the gate)

      - name: Promote cms-content → main
        run: |
          git config user.name  "promote-bot"
          git config user.email "promote-bot@users.noreply.github.com"
          git checkout main
          git merge --no-ff --no-edit origin/cms-content -m "promote: content → main"
          git push origin main

      - name: Re-align cms-content with main (keep the holding branch in lockstep)
        run: |
          # head commit here is the merge commit (no [ship]) so this push does
          # NOT re-trigger this workflow.
          git push origin main:cms-content
