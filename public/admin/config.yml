        widget: object
        required: false
        collapsed: true
        fields:
          - { name: title,       label: 'SEO title (overrides <title> + og:title)',                   widget: string,  required: false, i18n: translate }
          - { name: description, label: 'SEO description (overrides <meta description> + og:desc)',   widget: text,    required: false, i18n: translate }
          - { name: ogType,      label: 'OG type',                                                    widget: select,  options: ['website', 'article'], required: false, i18n: duplicate }
          - { name: ogImage,     label: 'OG image URL (1200×630, overrides cover for socials only)',  widget: string,  required: false, i18n: duplicate }
          - { name: ogImageAlt,  label: 'OG image alt text',                                          widget: string,  required: false, i18n: translate }
          - { name: noindex,     label: 'Block search engines from indexing this page',               widget: boolean, required: false, i18n: duplicate }
          - { name: canonical,   label: 'Canonical URL (rare; absolute https URL)',                   widget: string,  required: false, i18n: duplicate }
      - name: sections
        label: Sections
        widget: list
        required: false
        types:
