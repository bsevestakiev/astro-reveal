backend:
  name: github
  # TEST REPO — re-pointed away from Infragistics-IS/Marketing-Reveal so Sveltia
  # can never commit to the production site. Relay base_url removed for the same
  # reason (was the AWS OAuth relay for the prod repo).
  repo: bsevestakiev/astro-reveal
  branch: cms-content
  # Custom commit-message templates so the git log reads cleanly
  # ("content(blog): white-label-analytics — update" vs Decap's noisy default).
  commit_messages:
    create: 'content({{collection}}): {{slug}} — create'
    update: 'content({{collection}}): {{slug}} — update'
    delete: 'content({{collection}}): {{slug}} — delete'
    uploadMedia: 'media: upload {{path}}'
    deleteMedia: 'media: delete {{path}}'
    openAuthoring: '{{message}}'

# No publish_mode set on purpose. Sveltia does not implement Decap's
# `editorial_workflow` — every Save commits directly to `backend.branch:`
# above. As of mid-2026 editorial workflow is still unimplemented upstream
# (planned for Sveltia 1.0), so we approximate a review step by routing
# Sveltia at `cms-content` — a dedicated, NON-deployed buffer branch.
#
# Flow: editor saves in Sveltia (and /blog-from-brief, /blog-from-design
# write here too) → commits land on `cms-content` → `cms-content` does NOT
# auto-deploy (deploy.yml only triggers on `staging` and `main`) → a PR
# `cms-content` → `staging` is reviewed and merged → staging auto-deploys
# for visual QA on astro-staging.revealbi.io → `staging` is promoted to
# `main` via a normal PR for production. (Preview deploy of `cms-content`
# itself is deferred — would be a separate AWS bucket/CloudFront.)
#
# Do NOT add push-rejecting branch protection on `cms-content`: Sveltia
# errors on rejected pushes rather than falling back to PR creation.
#
# NOTE: the live /admin/ reads the *deployed* config.yml, so this branch
# switch only takes effect on production /admin/ once it reaches `main`,
# and on astro-staging.revealbi.io/admin/ once it reaches `staging`.

media_folder: 'public/images'
public_folder: '/images'

# Multilingual config. Each entry shows locale tabs at the top of the editor;
# Sveltia's "translate" button calls OpenAI to fill non-EN locales from EN.
# n8n's missing-files-only translation pipeline still runs alongside; whichever
# writer creates the file first wins (n8n won't clobber existing files).
#
# `initial_locales: default` enables ONLY the default locale (en) when an entry
# is opened/created, so editors can save with English alone — without it, every
# `i18n: true` field is required in all five locales and the Save is blocked
# until each tab is filled. EN is the source of truth and n8n generates the
# rest, so EN-only authoring is exactly what we want; an editor can still toggle
# a non-EN locale on per entry to hand-translate. (Replaces the deprecated
# `save_all_locales: false`; `default` = default locale only.)
i18n:
  structure: multiple_folders
  locales: [en, es, ja, ko, pt-BR]
  default_locale: en
  initial_locales: default

collections:
  - name: pages
    label: '📄 Pages'
    folder: 'src/content/pages'
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: false
    slug: '{{filename}}'
    summary: '{{filename}} — {{title}}'
    sortable_fields: ['filename', 'title']
    fields: &pages_fields
      - { name: title, label: Title, widget: string, i18n: translate }
      - { name: description, label: Description, widget: text, required: false, i18n: translate }
      - { name: cover, label: Cover image URL, widget: string, required: false, i18n: duplicate }
      - name: seo
