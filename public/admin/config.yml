  # Blog posts. Schema mirrors `blogSchema` in src/content/config.ts.
  # Body is markdown — the Comparison Table, Callout, and CTA Banner editor
  # components in public/admin/editor-components.js surface here automatically.
  - name: blog
    label: '📰 Blog'
    folder: 'src/content/blog'
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: true
    slug: '{{slug}}'
    summary: '{{filename}} — {{title}}'
    sortable_fields: ['date', 'filename', 'title']
    fields:
      - { name: title, label: Title, widget: string, i18n: translate }
      - { name: description, label: Description (meta + lead paragraph), widget: text, required: false, i18n: translate }
      # Date picker (date-only). All blog dates are already YYYY-MM-DD, so pinning
      # the format is safe; `format` keeps it stored as a plain string.
      - name: date
        label: Last updated
        widget: datetime
        required: false
        i18n: duplicate
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        picker_utc: true
      # Author dropdown — options must match src/lib/blog-authors.ts exactly
      # (an unlisted name renders with no avatar/bio).
      - name: author
        label: Author
        widget: select
        required: false
        i18n: duplicate
        options:
          - Casey Ciniello
          - Bilyana Petrova
          - Martin Atanasov
          - Zdravko Kolev
          - Jason Beres
      - { name: cover, label: Cover image URL, widget: string, required: false, hint: 'Used for social cards and blog index thumbnails.', i18n: duplicate }
      - { name: heroImage, label: Hero image URL, widget: string, required: false, hint: 'Top-of-post header image. Full URL or /-prefixed CDN path.', i18n: duplicate }
      # Categories dropdown. Renamed from the unused singular `category` field to
      # `categories` (a list) to match what posts actually use. Options are the EN
      # taxonomy; non-EN locales hold translated category strings, but with
      # `initial_locales: default` those tabs stay off during normal EN editing.
      - name: categories
        label: Categories
        widget: select
        multiple: true
        required: false
        i18n: translate
        options:
          - SaaS Analytics Trends
          - Embedded Analytics
          - Product Updates
          - Technical Insights
          - Product Reviews
          - AI Analytics
          - Business Intelligence
          - Developer Experience
          - Web SDK
          - TypeScript
          - Reveal 2.0
      - name: tags
        label: Tags
        widget: list
        required: false
        field: { name: tag, label: Tag, widget: string, i18n: translate }
      - { name: summary, label: Executive summary (HTML allowed), widget: text, required: false, hint: 'Renders in the sidebar callout box. Plain text is fine.', i18n: translate }
      - name: takeaways
        label: Key takeaways
        widget: list
        required: false
        hint: 'One bullet per entry. Renders as the "Key Takeaways" sidebar list.'
        field: { name: takeaway, label: Takeaway, widget: string, i18n: translate }
      # Bottom CTA toggle. Editor-component toolbar buttons aren't surfaced by
      # Sveltia yet, so this checkbox is how editors add the end-of-post
      # "Request a Demo" banner (rendered by BlogLayout). Leave off for posts
      # that already hand-place a CTA banner in the body, to avoid duplicates.
      - { name: ctaDemo, label: "Add a 'Request a Demo' CTA banner at the bottom", widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: ctaDemoHeadline, label: 'CTA headline (optional — overrides the default)', widget: string, required: false, i18n: translate }
      - { name: ctaDemoBody, label: 'CTA message (optional — overrides the default)', widget: text, required: false, i18n: translate }
      # Block-based body builder (＋ Add → pick a block → reorder). This is the
      # recommended way to author new posts — each block is an on-brand form, no
      # raw HTML. Leave empty to use the freeform "Body (markdown)" field below
      # instead (existing posts do that). If any blocks are added here, the
      # layout renders THESE and ignores the markdown body.
      - name: content
        label: Content blocks
        widget: list
        required: false
        types:
          - name: text
            label: Text
            summary: '{{fields.body}}'
            fields:
              - { name: body, label: Text (markdown), widget: markdown, i18n: translate }
          - name: comparison-table
            label: Comparison Table
            fields:
              - { name: headers, label: 'Header row (separate columns with | )', widget: string, i18n: translate }
              - name: rows
                label: Data rows
                widget: list
                required: false
                field: { name: row, label: 'Row (cells separated by | )', widget: string, i18n: translate }
          - name: callout
            label: Callout (highlight)
            fields:
              - { name: body, label: Callout body (markdown), widget: text, i18n: translate }
          - name: bonus-tip
            label: Bonus Tip
            fields:
              - { name: body, label: Tip body (markdown), widget: text, i18n: translate }
          - name: cta-banner
            label: CTA Banner
            fields:
              - { name: headline, label: Headline, widget: string, required: false, i18n: translate }
              - { name: msg, label: Message, widget: text, required: false, i18n: translate }
              - { name: buttonText, label: Button text, widget: string, default: 'REQUEST A DEMO', required: false, i18n: translate }
              - { name: buttonLink, label: Button link, widget: string, default: 'https://www.revealbi.io/request-demo', required: false, i18n: duplicate }
      - { name: body, label: 'Body (markdown — legacy; used only when no Content blocks above)', widget: markdown, required: false, i18n: translate }

  # Whitepapers. Same shape as the blog collection so editors get the same
  # fields and the same in-body components (Callout, CTA Banner, Gate,
  # Bonus Tip). The route `/whitepapers/<slug>/` renders these through
  # BlogLayout with isWhitepaper={true}: pink hero, gated lead-form, and
  # an About-the-Author card driven by the `authorBio` field. Insert the
  # `<!-- gate -->` marker in the body where the lead-form should split
  # preview from gated content.
  - name: whitepapers
    label: '📑 Whitepapers'
    folder: 'src/content/whitepapers'
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: true
    slug: '{{slug}}'
    summary: '{{filename}} — {{title}}'
    sortable_fields: ['date', 'filename', 'title']
    fields:
      - { name: title, label: Title, widget: string, i18n: translate }
      - { name: description, label: Description (meta + lead paragraph), widget: text, required: false, i18n: translate }
      - { name: date, label: 'Last updated (YYYY-MM-DD)', widget: string, required: false, i18n: duplicate }
      # Author dropdown — options must match src/lib/blog-authors.ts exactly.
      - name: author
        label: Author
        widget: select
        required: false
        i18n: duplicate
        options:
          - Casey Ciniello
          - Bilyana Petrova
          - Martin Atanasov
          - Zdravko Kolev
          - Jason Beres
      - { name: authorBio, label: Author bio (HTML allowed), widget: text, required: false, hint: 'Renders in the About-the-Author card below the gated content. Plain text or HTML <p>/<a>/<br>.', i18n: translate }
      - { name: cover, label: Cover image URL, widget: string, required: false, hint: 'Used for the hero image and the listing-page thumbnail.', i18n: duplicate }
      - { name: heroImage, label: Hero image URL, widget: string, required: false, hint: 'Optional. Defaults to cover when omitted.', i18n: duplicate }
      # Categories dropdown. Renamed from the unused singular `category` field to
      # `categories` (a list) to match what posts actually use. Options are the EN
      # taxonomy; non-EN locales hold translated category strings, but with
      # `initial_locales: default` those tabs stay off during normal EN editing.
      - name: categories
        label: Categories
        widget: select
        multiple: true
        required: false
        i18n: translate
        options:
          - SaaS Analytics Trends
          - Embedded Analytics
          - Product Updates
          - Technical Insights
          - Product Reviews
          - AI Analytics
          - Business Intelligence
          - Developer Experience
          - Web SDK
          - TypeScript
          - Reveal 2.0
      - name: tags
        label: Tags
        widget: list
        required: false
        field: { name: tag, label: Tag, widget: string, i18n: translate }
      - { name: summary, label: Executive summary (HTML allowed), widget: text, required: false, i18n: translate }
      - name: takeaways
        label: Key takeaways
        widget: list
        required: false
        hint: 'One bullet per entry.'
        field: { name: takeaway, label: Takeaway, widget: string, i18n: translate }
      - { name: body, label: 'Body (markdown — use the Gate button to split preview vs gated)', widget: markdown, required: false, i18n: translate }
