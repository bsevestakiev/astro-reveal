              - { name: secondaryCtaUrl, label: Secondary CTA URL, widget: string, required: false, i18n: duplicate }
              - { name: image, label: Image URL, widget: string, required: false, i18n: duplicate }
              - name: imageSrcset
                label: Image srcset
                widget: list
                required: false
                fields:
                  - { name: media, label: Media query, widget: string, i18n: duplicate }
                  - { name: srcset, label: Srcset URL, widget: string, i18n: duplicate }
              - { name: imageAlt, label: Image alt, widget: string, required: false, i18n: translate }
              - { name: zone, label: Zone, widget: number, value_type: int, required: false, i18n: duplicate }

          - name: dark-hero
            label: Dark hero
            fields:
              - { name: title, label: Title (HTML allowed), widget: text, required: false, i18n: translate }
              - { name: subhead, label: Subhead (HTML allowed), widget: text, required: false, i18n: translate }
              - { name: variant, label: 'Variant (centered, split-image, split-form, dark-navy, flat-split, tech-centered)', widget: string, required: false, i18n: duplicate }
              - { name: image, label: Image URL, widget: string, required: false, i18n: duplicate }
              - { name: imageAlt, label: Image alt, widget: string, required: false, i18n: translate }
              - name: imageSrcset
                label: Image srcset
                widget: list
                required: false
                fields:
                  - { name: media, label: Media query, widget: string, i18n: duplicate }
                  - { name: srcset, label: Srcset URL, widget: string, i18n: duplicate }
              - { name: ctaLabel, label: CTA label, widget: string, required: false, i18n: translate }
              - { name: ctaHref, label: CTA href, widget: string, required: false, i18n: duplicate }
              - { name: secondaryCtaLabel, label: Secondary CTA label, widget: string, required: false, i18n: translate }
